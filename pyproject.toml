[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost-api"
version = "0.8.0"
description = "FastAPI backend services (9 domains) — Bifrost Trade system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bifrost-core>=0.45.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "kubernetes>=28.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.25.0",
    "ruff==0.16.9",  # one version for CI and every venv; bump on purpose
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set. ruff 0.16 widened its default selection from 59 rules to 413,
# so leaving `select` unset made the lint depend on whichever ruff was installed.
# These four groups are the pre-0.16 default; widen them on purpose, not by upgrade.
select = ["E4", "E7", "E9", "F"]
