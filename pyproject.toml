[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost-api"
version = "0.1.2"
description = "FastAPI backend services (9 domains) — Bifrost Trade system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bifrost-core>=0.3.0",
    "bifrost-worker",
    "bifrost-socket",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "kubernetes>=28.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
